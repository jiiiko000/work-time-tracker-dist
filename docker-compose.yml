services:
  app:
    image: ghcr.io/jiiiko000/work-time-tracker:latest
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      - TZ=Asia/Tokyo
      - DB_PATH=/data/app.db
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
